services:
  postgres:
    image: postgres:16
    container_name: computer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password_dev123
      POSTGRES_DB: computer_dev
    ports:
      - "5432:5432"
    volumes:
      - computer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d computer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  computer_pg_data:
    name: computer_pg_data
