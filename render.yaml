databases:
  - name: studybyte-db
    databaseName: studybyte
    user: studybyte
    plan: free

services:
  - type: web
    name: studybyte-api
    runtime: node
    # This is an npm-workspaces monorepo: deps are hoisted to a single
    # root node_modules/package-lock.json, so `rootDir: backend` breaks
    # installs (Render would try to `npm install` inside backend/ alone,
    # which has no lockfile of its own). Install from the repo root and
    # target the backend workspace explicitly in every command instead.
    plan: free
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    preDeployCommand: npm run db:deploy --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studybyte-db
          property: connectionString
      # Set this once you know your Vercel URL (e.g. https://studybyte.vercel.app).
      # Required for CORS and for the password-reset email link to point
      # somewhere real - leave blank at first apply and fill in after the
      # frontend is deployed.
      - key: FRONTEND_URL
        sync: false
      # Render generates a strong random value for these on first deploy -
      # do not reuse the values from backend/.env.example or your local .env.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PASSWORD_RESET_TOKEN_TTL_MIN
        value: "30"
